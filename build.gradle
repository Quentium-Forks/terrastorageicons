plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url = "https://maven.fabricmc.net/"
	}
	maven {
		url = "https://cursemaven.com/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"terrastorageicons" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

configurations {
	nightConfigExtract
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// NightConfig.
	nightConfigExtract implementation("com.electronwill.night-config:core:${project.night_config_version}")
	nightConfigExtract implementation("com.electronwill.night-config:toml:${project.night_config_version}")

	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	implementation "maven.modrinth:terrastorage:${project.terrastorage_version}"
}

tasks.register("extractNightConfig", Copy) {
	from {
		configurations.nightConfigExtract.collect { zipTree(it) }
	}
	into layout.buildDirectory.dir("nightconfig")
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	dependsOn("extractNightConfig")

	from(layout.buildDirectory.dir("nightconfig")) {
		into ""
	}

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

tasks.jar {
	destinationDirectory = layout.buildDirectory.dir("libs/${project.minecraft_version}")
    archiveBaseName.set(project.archives_base_name)
    archiveVersion.set("${project.mod_version}+${project.minecraft_version}")
}

tasks.sourcesJar {
	destinationDirectory = layout.buildDirectory.dir("libs/${project.minecraft_version}")
    archiveBaseName.set(project.archives_base_name)
    archiveVersion.set("${project.mod_version}+${project.minecraft_version}")
}
